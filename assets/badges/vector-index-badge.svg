    </linearGradient>
    <linearGradient id="plate-highlight" x1="0" y1="0" x2="0" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="plate-shadow" x="-7" y="-7" width="134" height="45" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.55" result="blur" />
      <feOffset in="blur" dy="1.8" result="offset" />
      <feFlood flood-color="#26394a" flood-opacity="0.18" />
      <feComposite in2="offset" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
