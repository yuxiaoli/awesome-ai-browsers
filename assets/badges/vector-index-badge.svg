    <linearGradient id="plate-face" x1="0" y1="0" x2="0" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.42" stop-color="#ffffff" />
      <stop offset="1" stop-color="#f1f4f6" />
    </linearGradient>
    <linearGradient id="plate-depth" x1="0" y1="0" x2="0" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fafb" />
