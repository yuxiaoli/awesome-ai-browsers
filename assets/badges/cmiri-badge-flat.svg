  <title id="title">中国移动 · 香港创新院</title>
  <desc id="desc">扁平中国移动香港创新院徽章。左侧白色标志面板带细绿色边框，右侧以绿色到蓝色的横向渐变为背景，香港创新院文字为纯白色。没有阴影、高光、厚度或凹槽。标志和文字均保留原始矢量轮廓，无需外部字体。</desc>
